name = "cgtk-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Public, non-secret configuration.
# Secrets (SUPABASE_SERVICE_ROLE_KEY, QR_SIGNING_SECRET) are set with:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put QR_SIGNING_SECRET
# ENVIRONMENT di sini production, bukan development, walaupun ini blok vars
# bawaan. Alasannya: scripts/deploy.sh memanggil `wrangler deploy` tanpa
# `--env production`, jadi blok inilah yang benar-benar terpasang di API yang
# dipakai peserta. Selama isinya "development", CORS di API produksi menerima
# origin http://localhost:<port> mana pun dengan credentials: true.
#
# Kerja lokal tidak terpengaruh: `wrangler dev` membaca .dev.vars, dan di sana
# ENVIRONMENT tetap development.
[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://jqffpyeuuawuiyhilwzk.supabase.co"
ALLOWED_ORIGINS = "https://cgtk-web.inondezionenera.workers.dev"

# Rate limiting and offline-sync idempotency use KV.
# Create with: wrangler kv namespace create RATE_LIMIT
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "b6f19f64a1c94b2b85e5e60e44e8ed0b"

[observability]
enabled = true

[env.production]
name = "cgtk-api"

[env.production.vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://jqffpyeuuawuiyhilwzk.supabase.co"
ALLOWED_ORIGINS = "https://cgtk-web.inondezionenera.workers.dev"
