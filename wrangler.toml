name = "cgtk-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Public, non-secret configuration.
# Secrets (SUPABASE_SERVICE_ROLE_KEY, QR_SIGNING_SECRET) are set with:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put QR_SIGNING_SECRET
# ENVIRONMENT di sini production, bukan development, walaupun ini blok vars
# bawaan. Alasannya: scripts/deploy.sh memanggil `wrangler deploy` tanpa
# `--env production`, jadi blok inilah yang benar-benar terpasang di API yang
# dipakai peserta. Selama isinya "development", CORS di API produksi menerima
# origin http://localhost:<port> mana pun dengan credentials: true.
#
# Kerja lokal tidak terpengaruh: `wrangler dev` membaca .dev.vars, dan di sana
# ENVIRONMENT tetap development.
[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://jqffpyeuuawuiyhilwzk.supabase.co"
ALLOWED_ORIGINS = "https://cgtk-web.inondezionenera.workers.dev"

# Rate limiting and offline-sync idempotency use KV.
# Create with: wrangler kv namespace create RATE_LIMIT
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "b6f19f64a1c94b2b85e5e60e44e8ed0b"

# -----------------------------------------------------------------------------
# Pembatas laju bawaan Cloudflare.
#
# Versi sebelumnya menghitung sendiri di KV, dan TIDAK PERNAH bekerja: hasil
# baca KV di-cache di edge paling cepat 60 detik, sama persis dengan panjang
# jendelanya, jadi hitungannya selalu terbaca nol. Diuji dengan 24 permintaan
# berjarak tiga detik ke endpoint berbatas 10 per menit: nol yang ditolak.
#
# Binding ini menghitung di dalam jaringan Cloudflare, bukan di penyimpanan
# yang di-cache. period hanya boleh 10 atau 60 detik.
#
# namespace_id cuma pembeda antar-bucket di dalam Worker ini, bukan id sumber
# daya yang harus dibuat lebih dulu.
# -----------------------------------------------------------------------------
[[unsafe.bindings]]
name = "BATAS_UMUM"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 240, period = 60 }

[[unsafe.bindings]]
name = "BATAS_SCAN"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "BATAS_AUTH"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "BATAS_CEK"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "BATAS_SYNC"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 5, period = 60 }

[observability]
enabled = true

[env.production]
name = "cgtk-api"

[env.production.vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://jqffpyeuuawuiyhilwzk.supabase.co"
ALLOWED_ORIGINS = "https://cgtk-web.inondezionenera.workers.dev"
